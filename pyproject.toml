[project]
name = "multiagent-ai-lab"
version = "0.0.1"
description = "Local multi-agent RAG platform for the MDU group"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "openai>=3.42.0",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# The package folder is src/mrag, not src/multiagent_ai_lab (rule C2)
[tool.uv.build-backend]
module-name = "mrag"

# Alembic reads its settings from here. The database URL comes from mrag.config
[tool.alembic]
script_location = "%(here)s/migrations"

# dev is installed by default. demo (transformers backend) only with --group demo
[dependency-groups]
demo = [
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mac: real calls to the Mac model server (llama-swap must be running)",
    "transformers: real calls through the transformers backend (needs --group demo)",
]
