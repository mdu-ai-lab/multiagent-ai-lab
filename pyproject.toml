[project]
name = "multiagent-ai-lab"
version = "0.0.1"
description = "Local multi-agent RAG platform for the MDU group"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# The package folder is src/mrag, not src/multiagent_ai_lab (rule C2)
[tool.uv.build-backend]
module-name = "mrag"

# Alembic reads its settings from here. The database URL comes from mrag.config
[tool.alembic]
script_location = "%(here)s/migrations"
