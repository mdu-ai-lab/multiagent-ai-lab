# Publishes the live dashboard to GitHub Pages after CI passed on main, built from exactly the
# commit that CI tested. GitHub starts this workflow only from its file on main
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# The build only reads the code. Only the deploy job gets the two Pages permissions
permissions:
  contents: read

# One publish at a time. A newer one waits instead of cancelling a deployment in progress
concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  build:
    name: Build the dashboard
    # Only a passed CI run of a push to main in this repository. A pull request from a fork
    # can come from a branch that is also named main, so the branch name alone is not enough
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the commit that CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project from uv.lock
        run: uv sync --no-dev

      - name: Build the live dashboard
        run: uv run python -m mrag.site_build

      # GitHub keeps this artifact for 1 day only, then deletes it
      - name: Hand the page to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
