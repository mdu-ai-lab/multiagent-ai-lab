# Checks the live dashboard, its links and the demo Space every Monday and on demand. A
# failure opens one issue with the report. While that issue is open, a new failure adds a
# comment to it.
# GitHub runs scheduled and on-demand workflows only from main
name: Health

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      extra_url:
        description: "One more address to check. A wrong address tests the issue"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

env:
  DASHBOARD_URL: https://mdu-ai-lab.github.io/multiagent-ai-lab/
  ISSUE_TITLE: Live site health check failed

jobs:
  check:
    name: Check the live sites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Writing issues is the only extra permission, for the failure report
    permissions:
      contents: read
      issues: write
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The check uses only the Python standard library, so the Python of the runner is enough
      - name: Check the dashboard, its links and the demo Space
        id: check
        env:
          DEMO_SPACE: ${{ vars.DEMO_SPACE }}
          EXTRA_URL: ${{ inputs.extra_url }}
        run: |
          set +e
          python3 ops/health_check.py --dashboard "$DASHBOARD_URL" --space "$DEMO_SPACE" \
            --extra "$EXTRA_URL" --report "$RUNNER_TEMP/report.md"
          code=$?
          echo "failed=$([ "$code" -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open the issue or add a comment to the open one
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\nRun: %s\n' "$RUN_URL" >> "$RUNNER_TEMP/report.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/report.md"
          fi

      # The run is red too, so the failure also shows in the Actions list
      - name: Mark the run as failed
        if: steps.check.outputs.failed == 'true'
        run: exit 1
