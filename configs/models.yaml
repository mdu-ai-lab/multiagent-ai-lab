# Which model serves which role in each profile. Read by src/mrag/llm_client.py.
# Roles: main (answers, vision, agents), helper (routing and rewriting),
# embedding (search vectors), reranker (re-scoring search results).
# A model is a plain name or a name with a pinned Hugging Face revision.
# Profiles without an entry here have no models yet.

mac:
  # Names are the model IDs in configs/llama-swap.yaml. source and revision say where the
  # files come from. files lists the SHA-256 of every file llama-server loads, so a changed
  # or damaged file is noticed (a Mac test checks them)
  backend: openai_server
  models:
