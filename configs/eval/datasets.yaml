# The public datasets of the evaluation. Read by src/mrag/eval_data.py, which downloads them
# into data/public/<name>/ and checks every file against its size and SHA-256.
#
# hash_from tells where a SHA-256 comes from:
#   source    the source publishes it (the Git LFS hash of a Hugging Face file)
#   measured  the source publishes no SHA-256, so it was measured once by streaming the file on
#             20 November 2026. Every later download must match it
# Hugging Face addresses name a fixed revision, so the files behind them cannot change.
# Only the files the evaluation needs are listed: no training splits and no ready-made page
# images. unpack: true unpacks an archive into a folder of the same name without its ending.

